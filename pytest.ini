[pytest]
# Discovery is intentionally scoped to the maintained test suite under tests/.
#
# The project root contains many standalone debug / one-off scripts whose names
# match pytest's default discovery globs (test_*.py and *_test.py). Several of
# them execute code at import time and call sys.exit(), which makes a bare
# `pytest` invocation abort during COLLECTION (INTERNALERROR: SystemExit)
# before any real test runs. Restricting testpaths to tests/ makes
# `python -m pytest` collect only the real suite (tests/test_smoke.py).
#
# To run one of the legacy root-level scripts directly, invoke it explicitly:
#   python quick_integration_test.py
testpaths = tests
