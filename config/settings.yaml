# File: config/settings.yaml
# Cyber-EW Fusion Cell Configuration

pipeline:
  batch_size: 1000
  max_queue_size: 10000
  processing_interval: 1.0
  enable_parallel: true
  worker_count: 4

ingest:
  sources:
    - type: file
      path: "data/inputs/test_events.json"
      format: json
    
    - type: pcap
      path: "data/inputs/test.pcap"
      enabled: true
    
    - type: threat_intel
      feed_url: "https://feeds.threatfox.abuse.ch"
      enabled: true
  
  pcap_enabled: true
  syslog_enabled: false
  windows_events_enabled: true
  threat_intel_enabled: true
  max_file_size: 100000000  # 100MB

correlation:
  time_window_seconds: 300
  entity_linking_enabled: true
  max_cluster_size: 1000
  similarity_threshold: 0.7

behavior:
  baseline_days: 30
  learning_rate: 0.1
  anomaly_threshold: 3.0
  profile_update_interval: 3600

scoring:
  weights:
    severity: 0.3
    confidence: 0.25
    correlation: 0.2
    behavior: 0.15
    recency: 0.1
  
  confidence_decay_hours: 24.0
  min_confidence: 0.3
  
  thresholds:
    critical: 0.9
    high: 0.7
    medium: 0.5
    low: 0.3

system:
  log_level: "INFO"
  audit_log_enabled: true
  data_retention_days: 90
  
  # Directory paths (relative to project root)
  data_dir: "data"
  log_dir: "logs"
  temp_dir: "temp"