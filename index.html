<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyber-EW Fusion Cell</title>
    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          var desc = Object.getOwnPropertyDescriptor(window, "fetch") ||
                     Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), "fetch") ||
                     (typeof Window !== "undefined" && Object.getOwnPropertyDescriptor(Window.prototype, "fetch"));
          if (!desc || !desc.set) {
            try {
              Object.defineProperty(window, "fetch", {
                configurable: true,
                enumerable: true,
                get: function() { return origFetch; },
                set: function(v) { origFetch = v; }
              });
            } catch(e) {}
          }
        } catch(e) {}
      })();
    </script>

  </head>

  </body>
</html>
